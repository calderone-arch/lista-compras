<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lista da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F110B; --paper:#1B2015; --paper-2:#20261A; --ink:#FAF8F0;
    --pine:#1C2A20; --pine-line:#2E3A28; --gold:#F0B94A; --gold-soft:#F6CC79;
    --clay:#FF8E6E; --muted:#B9C4AE; --line:#333D2A;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; max-width:520px; margin:0 auto; padding-bottom:100px;
  }
  .hidden{display:none !important;}

  #loading{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; color:var(--muted); font-size:14px;
  }
  #loading .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--gold); animation:spin 0.8s linear infinite; margin-bottom:14px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #error-banner{
    background:#3A1E17; border:1px solid var(--clay); color:var(--clay);
    padding:12px 16px; font-size:13px; text-align:center; margin:12px 16px; border-radius:10px;
  }
  #error-banner button{
    margin-top:8px; background:var(--clay); color:#2A130C; border:none; border-radius:8px;
    padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }

  #gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center;
  }
  #gate h1{font-family:'Fraunces',serif; font-weight:600; font-size:28px; color:var(--gold-soft); margin:0 0 6px;}
  #gate p{color:var(--muted); font-size:14px; margin:0 0 28px; max-width:280px;}
  .gate-btn{
    width:100%; max-width:300px; padding:16px 18px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:16px; font-weight:600; color:var(--ink);
    margin-bottom:12px; text-align:left; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .gate-btn .sub{display:block; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px;}
  .gate-btn .ico{font-size:22px; flex-shrink:0;}
  .gate-btn:active{background:var(--paper-2);}

  header{
    position:sticky; top:0; z-index:5; background:var(--pine); color:var(--ink);
    padding:18px 20px 16px; border-radius:0 0 20px 20px; border-bottom:1px solid var(--pine-line);
  }
  header .row{display:flex; justify-content:space-between; align-items:flex-start;}
  header h1{font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; color:var(--ink);}
  header .role-tag{font-size:11.5px; color:var(--muted); margin-top:3px;}
  header .btns{display:flex; gap:6px;}
  header .switch-btn{
    background:rgba(255,255,255,0.08); border:1px solid var(--pine-line); color:var(--ink);
    font-size:11px; padding:6px 9px; border-radius:20px; font-family:'Inter',sans-serif; cursor:pointer;
  }
  .progress-wrap{margin-top:14px;}
  .progress-bar{height:6px; border-radius:4px; background:rgba(255,255,255,0.1); overflow:hidden;}
  .progress-fill{height:100%; background:var(--gold); border-radius:4px; transition:width .25s ease;}
  .progress-label{font-size:11.5px; color:var(--muted); margin-top:6px;}

  main{padding:18px 16px 8px;}

  .category{background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; overflow:hidden;}
  .cat-header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; gap:8px;}
  .cat-header .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .cat-emoji{font-size:19px; flex-shrink:0;}
  .cat-name{font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cat-header-right{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .cat-count{font-size:12px; color:var(--gold); font-weight:700; background:rgba(240,185,74,0.15); padding:3px 9px; border-radius:20px;}
  .chevron{font-size:13px; color:var(--muted); transition:transform .18s ease; margin-left:4px; display:inline-block;}
  .cat-body{border-top:1px solid var(--line);}
  .cat-body.collapsed{display:none;}

  .subcat-title-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px;}
  .subcat-title{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .mini-actions{display:flex; gap:2px;}

  .item{display:flex; align-items:flex-start; gap:11px; padding:11px 16px; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}

  .check{
    width:24px; height:24px; border-radius:50%; border:1.8px solid #5D6B54; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:1px;
    background:transparent; font-size:14px; font-weight:700; color:var(--bg);
  }
  .check.on{background:var(--gold); border-color:var(--gold);}

  .item-photo{width:42px; height:42px; border-radius:9px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); margin-top:1px;}
  .item-main{flex:1; min-width:0;}
  .item-name{font-size:15.5px; color:var(--ink); line-height:1.35; font-weight:500;}
  .item.checked .item-name{color:var(--muted); text-decoration:line-through; font-weight:400;}
  .item-note{font-size:12.5px; color:var(--gold-soft); font-style:italic; margin-top:2px;}
  .item-actions{display:flex; gap:2px; flex-shrink:0;}
  .icon-btn{background:none; border:none; font-size:15px; color:var(--muted); padding:5px; cursor:pointer;}
  .icon-btn.danger{color:var(--clay);}

  .add-item-row{display:flex; align-items:center; gap:8px; padding:10px 16px 14px;}
  .add-item-row input{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:14px;
    font-family:'Inter',sans-serif; background:var(--paper-2); color:var(--ink);
  }
  .add-item-row button{
    background:var(--gold); color:#1B1400; border:none; border-radius:10px; padding:9px 14px;
    font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0;
  }

  .add-subcat-link{
    background:none; border:none; color:var(--gold-soft); font-size:13.5px; font-weight:600;
    padding:10px 16px; cursor:pointer; text-align:left; display:block;
  }
  .add-cat-btn{
    width:100%; background:var(--paper); border:1.5px dashed var(--line); border-radius:14px;
    padding:14px; text-align:center; margin-top:2px; font-size:14.5px; font-weight:600; color:var(--gold-soft); cursor:pointer;
  }

  footer.mae-hint{text-align:center; color:var(--muted); font-size:12px; padding:18px 20px 6px;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--paper); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:20px 20px 26px; max-height:88vh; overflow-y:auto; border-top:1px solid var(--line);}
  .modal h3{font-family:'Fraunces',serif; font-weight:600; color:var(--gold-soft); margin:0 0 14px; font-size:17px;}
  .field-label{font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 5px;}
  .modal select, .modal input[type="text"], .modal textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:14.5px;
    font-family:'Inter',sans-serif; background:var(--paper-2); color:var(--ink);
  }
  .modal textarea{resize:vertical; min-height:60px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1; padding:12px; border-radius:10px; font-size:14.5px; font-weight:700; border:none; cursor:pointer;}
  .btn-cancel{background:var(--paper-2); color:var(--ink); border:1px solid var(--line) !important;}
  .btn-save{background:var(--gold); color:#1B1400;}
  .btn-delete{background:none; color:var(--clay); font-size:13.5px; text-align:center; margin-top:14px; border:none; width:100%; cursor:pointer; font-weight:600;}

  .photo-row{display:flex; align-items:center; gap:12px; margin-top:8px;}
  .photo-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--line); background:var(--paper-2);}
  .photo-btns{display:flex; flex-direction:column; gap:6px; flex:1;}
  .photo-btns button{
    background:var(--paper-2); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .photo-btns button.remove{color:var(--clay);}

  .fab{
    position:fixed; bottom:26px; right:20px; width:56px; height:56px; border-radius:50%;
    background:var(--gold); color:#1B1400; font-size:26px; border:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.5); cursor:pointer; z-index:10; font-weight:700;
  }
  .sync-tag{font-size:10.5px; color:var(--muted); text-align:center; padding:4px 0 0;}
</style>
</head>
<body>
<div id="app">

  <div id="loading">
    <div class="spinner"></div>
    <div>Carregando a lista...</div>
  </div>

  <div id="boot-error" class="hidden" style="max-width:480px;margin:40px auto;padding:0 20px;text-align:center;">
    <div style="font-size:15px;color:var(--clay);margin-bottom:10px;">Não consegui carregar a lista.</div>
    <div id="boot-error-detail" style="font-size:12.5px;color:var(--muted);word-break:break-word;margin-bottom:16px;"></div>
    <button id="boot-retry" style="background:var(--gold);color:#1B1400;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;">Tentar de novo</button>
  </div>

  <div id="gate" class="hidden">
    <h1>Lista da Casa</h1>
    <p>Quem está usando a lista agora?</p>
    <button class="gate-btn" id="gate-editor">
      <span class="ico">✏️</span>
      <span>Dispensa<span class="sub">Editar itens, categorias, fotos e observações</span></span>
    </button>
    <button class="gate-btn" id="gate-mae">
      <span class="ico">🛒</span>
      <span>Compras<span class="sub">Só marcar o que já foi comprado</span></span>
    </button>
  </div>

  <div id="pin-gate" class="hidden" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;">
    <h1 style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--gold-soft);margin:0 0 8px;">Perfil Dispensa</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 20px;">Digite o PIN pra continuar</p>
    <input type="tel" inputmode="numeric" maxlength="4" id="pin-input"
      style="width:140px;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);">
    <div id="pin-error" class="hidden" style="color:var(--clay);font-size:13px;margin-top:10px;">PIN incorreto, tenta de novo.</div>
    <button id="pin-confirm" style="margin-top:18px;background:var(--gold);color:#1B1400;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:700;">Confirmar</button>
    <button id="pin-cancel" style="margin-top:10px;background:none;border:none;color:var(--muted);font-size:13px;">Cancelar</button>
  </div>

  <div id="main-view" class="hidden">
    <header>
      <div class="row">
        <div>
          <h1>Lista da Casa</h1>
          <div class="role-tag" id="role-tag"></div>
        </div>
        <div class="btns">
          <button class="switch-btn" id="refresh-btn">atualizar</button>
          <button class="switch-btn" id="switch-role">trocar perfil</button>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </header>

    <div id="error-banner" class="hidden"></div>

    <main id="categories"></main>

    <div id="editor-footer" class="hidden" style="padding:0 16px 8px;">
      <button class="add-cat-btn" id="add-cat-btn">+ Nova categoria</button>
    </div>

    <footer class="mae-hint hidden" id="mae-hint">Toque na bolinha ao lado de cada item para marcar como comprado.</footer>
    <div class="sync-tag" id="sync-tag"></div>

    <button class="fab hidden" id="fab-add">+</button>
  </div>

</div>

<script>
(function(){
  var BIN_ID = "6aa88097ffd5d16053072bd3";
  var ACCESS_KEY = "$2a$10$MH7BQnixsh0Pxih/NNqFle9rNQOwUKC71SJ5iS69ihH/l7LkZ2Rx.";
  var API_BASE = "https://api.jsonbin.io/v3/b/" + BIN_ID;
  var ROLE_KEY = "papel-do-usuario-lista-casa";
  var DEFAULTS_VERSION = 2;

  var data = null;
  var role = null;
  var collapsedCats = {};
  var pollTimer = null;

  function uid(){ return Math.random().toString(36).slice(2,9); }
  function mkItem(name, checked){ return {id:uid(), name:name, checked:!!checked, note:"", photo:null}; }

  function defaultData(){
    return {
      defaultsVersion: DEFAULTS_VERSION,
      categories: [
        { id: uid(), emoji: "🍎", name: "Alimentos (Despensa)", subcats: [
          { id: uid(), name: "", items: [
            mkItem("Arroz", true), mkItem("Feijão", true), mkItem("Macarrão", true),
            mkItem("Óleo / Azeite", true), mkItem("Sal", true), mkItem("Açúcar / Adoçante", true),
            mkItem("Café", true), mkItem("Vinagre", true)
          ]},
          { id: uid(), name: "🐈 Gatas", items: [ mkItem("Ração Seca", true), mkItem("Ração Molhada", false) ]},
          { id: uid(), name: "Temperos", items: [ mkItem("Corante", true), mkItem("Tempero Seco", true), mkItem("Açafrão", true) ]},
          { id: uid(), name: "Enlatados e conservas", items: [
            mkItem("Milho em conserva", false), mkItem("Ervilha", false),
            mkItem("Extrato de tomate", false), mkItem("Atum", false)
          ]}
        ]},
        { id: uid(), emoji: "🍞", name: "Padaria e Grãos", subcats: [{ id: uid(), name: "", items: [
          mkItem("Pão de forma", false), mkItem("Farinha de trigo", false),
          mkItem("Aveia", false), mkItem("Granola", false), mkItem("Biscoito / Bolacha", false)
        ]}]},
        { id: uid(), emoji: "🥬", name: "Vegetais essenciais", subcats: [{ id: uid(), name: "", items: [
          mkItem("Cebola", true), mkItem("Alho", true), mkItem("Cenoura", true), mkItem("Batata", true),
          mkItem("Alface", true), mkItem("Pimentão", true), mkItem("Tomate", true), mkItem("Vinagreira", true),
          mkItem("Couve", false), mkItem("Cheiro-verde", false)
        ]}]},
        { id: uid(), emoji: "🧀", name: "Laticínios e geladeira", subcats: [{ id: uid(), name: "", items: [
          mkItem("Leite", false), mkItem("Ovos", true), mkItem("Manteiga", true),
          mkItem("Queijo", false), mkItem("Iogurte", false)
        ]}]},
        { id: uid(), emoji: "🥤", name: "Bebidas", subcats: [{ id: uid(), name: "", items: [
          mkItem("Água mineral", false), mkItem("Suco", false), mkItem("Refrigerante", false),
          mkItem("Achocolatado", false), mkItem("Chá", false)
        ]}]},
        { id: uid(), emoji: "❄️", name: "Congelados", subcats: [{ id: uid(), name: "", items: [
          mkItem("Legumes congelados", false), mkItem("Polpa de fruta", false), mkItem("Sorvete", false)
        ]}]},
        { id: uid(), emoji: "🧼", name: "Limpeza", subcats: [{ id: uid(), name: "", items: [
          mkItem("Sabão em barra", true), mkItem("Detergente", true), mkItem("Desinfetante", true),
          mkItem("Sabão em pó", true), mkItem("Sabão líquido", false), mkItem("Amaciante", true),
          mkItem("Esponja de cozinha", true), mkItem("Lã de Aço", true), mkItem("Água Sanitária", false),
          mkItem("Multiuso", false)
        ]}]},
        { id: uid(), emoji: "🧻", name: "Utilidades e descartáveis", subcats: [{ id: uid(), name: "", items: [
          mkItem("Papel alumínio", false), mkItem("Filme plástico", false), mkItem("Saco de lixo", false),
          mkItem("Guardanapo", false), mkItem("Pilha", false), mkItem("Fósforo / Isqueiro", false)
        ]}]},
        { id: uid(), emoji: "🚿", name: "Higiene pessoal", subcats: [{ id: uid(), name: "", items: [
          mkItem("Sabonete", true), mkItem("Xampu", true), mkItem("Condicionador", true),
          mkItem("Pasta de dente", true), mkItem("Papel higiênico", true), mkItem("Desodorante", true),
          mkItem("Talco", true), mkItem("Fio dental", false), mkItem("Protetor solar", false),
          mkItem("Absorvente / Protetor diário", false)
        ]}]},
        { id: uid(), emoji: "💊", name: "Farmácia e primeiros socorros", subcats: [{ id: uid(), name: "", items: [
          mkItem("Álcool 70%", false), mkItem("Curativo / Band-aid", false), mkItem("Analgésico", false),
          mkItem("Soro fisiológico", false), mkItem("Repelente", false)
        ]}]}
      ]
    };
  }

  function mergeInDefaults(existing){
    if(!existing.defaultsVersion) existing.defaultsVersion = 1;
    if(existing.defaultsVersion >= DEFAULTS_VERSION) return existing;
    var defaults = defaultData();
    defaults.categories.forEach(function(defCat){
      var cat = existing.categories.find(function(c){return c.name===defCat.name;});
      if(!cat){ existing.categories.push(defCat); return; }
      defCat.subcats.forEach(function(defSub){
        var sub = cat.subcats.find(function(s){return s.name===defSub.name;});
        if(!sub){ cat.subcats.push(defSub); return; }
        defSub.items.forEach(function(defItem){
          var exists = sub.items.some(function(it){return it.name.toLowerCase()===defItem.name.toLowerCase();});
          if(!exists) sub.items.push(defItem);
        });
      });
    });
    existing.defaultsVersion = DEFAULTS_VERSION;
    return existing;
  }

  function loadRole(){ try{ return localStorage.getItem(ROLE_KEY); }catch(e){ return null; } }
  function saveRole(r){ try{ localStorage.setItem(ROLE_KEY, r); }catch(e){} }

  function showError(msg, retryFn){
    var banner = document.getElementById("error-banner");
    banner.innerHTML = esc(msg) + (retryFn ? '<br><button id="err-retry">Tentar de novo</button>' : "");
    banner.classList.remove("hidden");
    if(retryFn) document.getElementById("err-retry").onclick = retryFn;
  }
  function clearError(){ document.getElementById("error-banner").classList.add("hidden"); }

  async function fetchRemote(){
    var res = await fetch(API_BASE + "/latest", {
      headers: { "X-Access-Key": ACCESS_KEY }
    });
    if(!res.ok) throw new Error("Falha ao buscar a lista (HTTP " + res.status + ")");
    var json = await res.json();
    return json.record;
  }
  async function saveRemote(d){
    var res = await fetch(API_BASE, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": ACCESS_KEY,
        "X-Bin-Versioning": "false"
      },
      body: JSON.stringify(d)
    });
    if(!res.ok) throw new Error("Falha ao salvar (HTTP " + res.status + ")");
    return res.json();
  }

  async function loadData(silent){
    try{
      var remote = await fetchRemote();
      if(!remote || !remote.categories){
        var fresh = defaultData();
        await saveRemote(fresh);
        clearError();
        return fresh;
      }
      var merged = mergeInDefaults(remote);
      clearError();
      return merged;
    }catch(e){
      if(!silent) showError("Não foi possível carregar a lista. Verifique sua internet.", function(){ init(); });
      throw e;
    }
  }

  async function persist(){
    try{
      await saveRemote(data);
      clearError();
      document.getElementById("sync-tag").textContent = "Sincronizado " + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    }catch(e){
      showError("Não foi possível salvar essa alteração. Verifique sua internet e tente de novo.", function(){ persist(); });
    }
  }

  function findItem(itemId){
    for(var c of data.categories){
      for(var s of c.subcats){
        for(var it of s.items){ if(it.id === itemId) return {cat:c, sub:s, item:it}; }
      }
    }
    return null;
  }
  function findCat(catId){ return data.categories.find(function(c){return c.id===catId;}); }
  function findSub(catId, subId){ var c = findCat(catId); return c ? c.subcats.find(function(s){return s.id===subId;}) : null; }

  function totalCounts(){
    var total=0, done=0;
    data.categories.forEach(function(c){ c.subcats.forEach(function(s){ s.items.forEach(function(it){ total++; if(it.checked) done++; }); }); });
    return {total:total, done:done};
  }

  function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

  function resizeImage(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function itemHtml(it, isEditor){
    var checkedClass = it.checked ? "checked" : "";
    var checkOn = it.checked ? "on" : "";
    var checkMark = it.checked ? "✓" : "";
    var photoHtml = it.photo ? '<img class="item-photo" src="'+it.photo+'">' : "";
    var noteHtml = it.note ? '<div class="item-note">'+esc(it.note)+'</div>' : "";
    var actions = "";
    if(isEditor){
      actions = '<div class="item-actions">'+
        '<button class="icon-btn" data-edit-item="'+it.id+'">✎</button>'+
        '<button class="icon-btn danger" data-del-item="'+it.id+'">✕</button>'+
        '</div>';
    }
    return '<div class="item '+checkedClass+'">'+
      '<div class="check '+checkOn+'" data-toggle="'+it.id+'">'+checkMark+'</div>'+
      photoHtml+
      '<div class="item-main"><div class="item-name">'+esc(it.name)+'</div>'+noteHtml+'</div>'+
      actions+
      '</div>';
  }

  function render(){
    var isEditor = role === "editor";
    document.getElementById("role-tag").textContent = isEditor ? "Perfil: Dispensa (edição completa)" : "Perfil: Compras (marcar itens)";
    document.getElementById("editor-footer").classList.toggle("hidden", !isEditor);
    document.getElementById("fab-add").classList.toggle("hidden", !isEditor);
    document.getElementById("mae-hint").classList.toggle("hidden", isEditor);

    var counts = totalCounts();
    var pct = counts.total ? Math.round((counts.total-counts.done)/counts.total*100) : 0;
    document.getElementById("progress-fill").style.width = (100-pct) + "%";
    document.getElementById("progress-label").textContent = (counts.total-counts.done) + " itens faltando de " + counts.total;

    var wrap = document.getElementById("categories");
    wrap.innerHTML = "";

    data.categories.forEach(function(cat){
      var catTotal=0, catDone=0;
      cat.subcats.forEach(function(s){ s.items.forEach(function(it){ catTotal++; if(it.checked) catDone++; }); });

      var catEl = document.createElement("div");
      catEl.className = "category";
      var collapsed = !!collapsedCats[cat.id];

      var catActionsHtml = isEditor ?
        '<button class="icon-btn" data-editcat="'+cat.id+'">✎</button>'+
        '<button class="icon-btn danger" data-delcat="'+cat.id+'">✕</button>' : "";

      var headerHtml = '<div class="cat-header" data-cat="'+cat.id+'">'+
        '<div class="left"><span class="cat-emoji">'+cat.emoji+'</span><span class="cat-name">'+esc(cat.name)+'</span></div>'+
        '<div class="cat-header-right">'+
          '<span class="cat-count">'+catDone+'/'+catTotal+'</span>'+
          catActionsHtml+
          '<span class="chevron" style="transform:rotate('+(collapsed?'-90deg':'0deg')+')">▾</span>'+
        '</div></div>';

      var bodyHtml = '<div class="cat-body '+(collapsed?'collapsed':'')+'" data-catbody="'+cat.id+'">';

      cat.subcats.forEach(function(sub){
        if(sub.name || isEditor){
          bodyHtml += '<div class="subcat-title-row"><div class="subcat-title">'+(sub.name ? esc(sub.name) : "Geral")+'</div>';
          if(isEditor){
            bodyHtml += '<div class="mini-actions">'+
              '<button class="icon-btn" data-editsub="'+cat.id+'|'+sub.id+'">✎</button>'+
              '<button class="icon-btn danger" data-delsub="'+cat.id+'|'+sub.id+'">✕</button>'+
              '</div>';
          }
          bodyHtml += '</div>';
        }
        sub.items.forEach(function(it){ bodyHtml += itemHtml(it, isEditor); });
        if(isEditor){
          bodyHtml += '<div class="add-item-row">'+
            '<input type="text" placeholder="Adicionar item..." data-newitem-cat="'+cat.id+'" data-newitem-sub="'+sub.id+'">'+
            '<button data-additem-cat="'+cat.id+'" data-additem-sub="'+sub.id+'">Adicionar</button>'+
            '</div>';
        }
      });

      if(isEditor){ bodyHtml += '<button class="add-subcat-link" data-addsubcat="'+cat.id+'">+ Nova subcategoria</button>'; }

      bodyHtml += '</div>';
      catEl.innerHTML = headerHtml + bodyHtml;
      wrap.appendChild(catEl);
    });

    attachEvents();
  }

  function attachEvents(){
    document.querySelectorAll("[data-toggle]").forEach(function(el){
      el.onclick = function(){
        var found = findItem(el.getAttribute("data-toggle"));
        if(found){ found.item.checked = !found.item.checked; render(); persist(); }
      };
    });

    document.querySelectorAll("[data-cat]").forEach(function(el){
      el.onclick = function(){ var id = el.getAttribute("data-cat"); collapsedCats[id] = !collapsedCats[id]; render(); };
    });

    if(role === "editor"){
      document.querySelectorAll("[data-additem-cat]").forEach(function(btn){
        btn.onclick = function(){
          var catId = btn.getAttribute("data-additem-cat");
          var subId = btn.getAttribute("data-additem-sub");
          var input = document.querySelector('[data-newitem-cat="'+catId+'"][data-newitem-sub="'+subId+'"]');
          var name = input.value.trim();
          if(!name) return;
          var sub = findSub(catId, subId);
          sub.items.push(mkItem(name, false));
          render(); persist();
        };
      });

      document.querySelectorAll("[data-edit-item]").forEach(function(el){
        el.onclick = function(){ openEditItemModal(el.getAttribute("data-edit-item")); };
      });
      document.querySelectorAll("[data-del-item]").forEach(function(el){
        el.onclick = function(){
          var id = el.getAttribute("data-del-item");
          var found = findItem(id);
          if(found && confirm('Remover "'+found.item.name+'"?')){
            found.sub.items = found.sub.items.filter(function(i){return i.id!==id;});
            render(); persist();
          }
        };
      });

      document.querySelectorAll("[data-addsubcat]").forEach(function(el){
        el.onclick = function(){ openSubcatModal(el.getAttribute("data-addsubcat"), null); };
      });
      document.querySelectorAll("[data-editsub]").forEach(function(el){
        el.onclick = function(e){ e.stopPropagation(); var p = el.getAttribute("data-editsub").split("|"); openSubcatModal(p[0], p[1]); };
      });
      document.querySelectorAll("[data-delsub]").forEach(function(el){
        el.onclick = function(e){
          e.stopPropagation();
          var p = el.getAttribute("data-delsub").split("|");
          var cat = findCat(p[0]); var sub = findSub(p[0], p[1]);
          if(sub && confirm('Remover a subcategoria "'+(sub.name||"Geral")+'" e todos os itens dela?')){
            cat.subcats = cat.subcats.filter(function(s){return s.id!==p[1];});
            render(); persist();
          }
        };
      });

      document.querySelectorAll("[data-editcat]").forEach(function(el){
        el.onclick = function(e){ e.stopPropagation(); openCatModal(el.getAttribute("data-editcat")); };
      });
      document.querySelectorAll("[data-delcat]").forEach(function(el){
        el.onclick = function(e){
          e.stopPropagation();
          var cat = findCat(el.getAttribute("data-delcat"));
          if(cat && confirm('Remover a categoria "'+cat.name+'" e tudo dentro dela?')){
            data.categories = data.categories.filter(function(c){return c.id!==cat.id;});
            render(); persist();
          }
        };
      });
    }
  }

  function photoRowHtml(currentPhoto){
    return '<div class="photo-row">'+
      '<img class="photo-preview" id="photo-preview" src="'+(currentPhoto||"")+'" style="'+(currentPhoto?'':'display:none;')+'">'+
      '<div class="photo-btns">'+
        '<button type="button" id="photo-pick">📷 '+(currentPhoto?"Trocar foto":"Adicionar foto")+'</button>'+
        (currentPhoto ? '<button type="button" class="remove" id="photo-remove">Remover foto</button>' : '')+
      '</div>'+
      '<input type="file" accept="image/*" id="photo-input" style="display:none;">'+
      '</div>';
  }

  function wirePhotoRow(state){
    var pickBtn = document.getElementById("photo-pick");
    var fileInput = document.getElementById("photo-input");
    var preview = document.getElementById("photo-preview");
    pickBtn.onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(){
      if(fileInput.files && fileInput.files[0]){
        resizeImage(fileInput.files[0], 480, 0.65).then(function(dataUrl){
          state.photo = dataUrl;
          preview.src = dataUrl;
          preview.style.display = "block";
          var removeBtn = document.getElementById("photo-remove");
          if(!removeBtn){
            removeBtn = document.createElement("button");
            removeBtn.type = "button"; removeBtn.className = "remove"; removeBtn.id = "photo-remove";
            removeBtn.textContent = "Remover foto";
            document.querySelector(".photo-btns").appendChild(removeBtn);
            removeBtn.onclick = function(){
              state.photo = null; preview.style.display = "none"; removeBtn.remove();
              pickBtn.textContent = "📷 Adicionar foto";
            };
          }
          pickBtn.textContent = "📷 Trocar foto";
        });
      }
    };
    var removeBtn0 = document.getElementById("photo-remove");
    if(removeBtn0){
      removeBtn0.onclick = function(){
        state.photo = null; preview.style.display = "none"; removeBtn0.remove();
        pickBtn.textContent = "📷 Adicionar foto";
      };
    }
  }

  function openEditItemModal(itemId){
    var found = findItem(itemId);
    if(!found) return;
    var state = { photo: found.item.photo };
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Editar item</h3>'+
        '<div class="field-label">Nome</div>'+
        '<input type="text" id="edit-name" value="'+esc(found.item.name)+'">'+
        '<div class="field-label">Observação (opcional)</div>'+
        '<textarea id="edit-note" placeholder="Ex: marca X, tamanho grande...">'+esc(found.item.note)+'</textarea>'+
        '<div class="field-label">Foto do produto (ajuda sua mãe a identificar)</div>'+
        photoRowHtml(found.item.photo)+
        '<div class="modal-actions">'+
          '<button class="btn-cancel" id="edit-cancel">Cancelar</button>'+
          '<button class="btn-save" id="edit-save">Salvar</button>'+
        '</div>'+
        '<button class="btn-delete" id="edit-delete">Remover item</button>'+
      '</div>';
    document.body.appendChild(overlay);
    wirePhotoRow(state);

    document.getElementById("edit-cancel").onclick = function(){ overlay.remove(); };
    overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
    document.getElementById("edit-save").onclick = function(){
      var name = document.getElementById("edit-name").value.trim();
      if(!name) return;
      found.item.name = name;
      found.item.note = document.getElementById("edit-note").value.trim();
      found.item.photo = state.photo;
      overlay.remove(); render(); persist();
    };
    document.getElementById("edit-delete").onclick = function(){
      if(confirm('Remover "'+found.item.name+'"?')){
        found.sub.items = found.sub.items.filter(function(i){return i.id!==itemId;});
        overlay.remove(); render(); persist();
      }
    };
  }

  function openAddModal(){
    var catOptions = "";
    data.categories.forEach(function(c){ catOptions += '<option value="'+c.id+'">'+c.emoji+' '+esc(c.name)+'</option>'; });
    var state = { photo: null };
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Adicionar item</h3>'+
        '<div class="field-label">Categoria</div>'+
        '<select id="add-cat">'+catOptions+'</select>'+
        '<div class="field-label">Subcategoria</div>'+
        '<select id="add-sub"></select>'+
        '<div class="field-label">Nome do item</div>'+
        '<input type="text" id="add-name" placeholder="Ex: Papel toalha">'+
        '<div class="field-label">Observação (opcional)</div>'+
        '<textarea id="add-note" placeholder="Ex: marca X, tamanho grande..."></textarea>'+
        '<div class="field-label">Foto do produto (opcional)</div>'+
        photoRowHtml(null)+
        '<div class="modal-actions">'+
          '<button class="btn-cancel" id="add-cancel">Cancelar</button>'+
          '<button class="btn-save" id="add-save">Adicionar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    wirePhotoRow(state);

    function refreshSubs(){
      var catId = document.getElementById("add-cat").value;
      var cat = findCat(catId);
      var subSel = document.getElementById("add-sub");
      subSel.innerHTML = "";
      cat.subcats.forEach(function(s){
        var opt = document.createElement("option");
        opt.value = s.id; opt.textContent = s.name || "(geral)";
        subSel.appendChild(opt);
      });
    }
    refreshSubs();
    document.getElementById("add-cat").onchange = refreshSubs;

    document.getElementById("add-cancel").onclick = function(){ overlay.remove(); };
    overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
    document.getElementById("add-save").onclick = function(){
      var name = document.getElementById("add-name").value.trim();
      if(!name) return;
      var sub = findSub(document.getElementById("add-cat").value, document.getElementById("add-sub").value);
      var newItem = mkItem(name, false);
      newItem.note = document.getElementById("add-note").value.trim();
      newItem.photo = state.photo;
      sub.items.push(newItem);
      overlay.remove(); render(); persist();
    };
  }

  function openCatModal(catId){
    var cat = catId ? findCat(catId) : null;
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>'+(cat?"Editar categoria":"Nova categoria")+'</h3>'+
        '<div class="field-label">Emoji (opcional)</div>'+
        '<input type="text" id="cat-emoji" maxlength="4" value="'+esc(cat?cat.emoji:"")+'" placeholder="Ex: 🧴">'+
        '<div class="field-label">Nome da categoria</div>'+
        '<input type="text" id="cat-name" value="'+esc(cat?cat.name:"")+'" placeholder="Ex: Farmácia">'+
        '<div class="modal-actions">'+
          '<button class="btn-cancel" id="cat-cancel">Cancelar</button>'+
          '<button class="btn-save" id="cat-save">'+(cat?"Salvar":"Criar")+'</button>'+
        '</div>'+
        (cat ? '<button class="btn-delete" id="cat-delete">Remover categoria</button>' : '')+
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("cat-cancel").onclick = function(){ overlay.remove(); };
    overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
    document.getElementById("cat-save").onclick = function(){
      var name = document.getElementById("cat-name").value.trim();
      if(!name) return;
      var emoji = document.getElementById("cat-emoji").value.trim() || "📦";
      if(cat){ cat.name = name; cat.emoji = emoji; }
      else { data.categories.push({id:uid(), emoji:emoji, name:name, subcats:[{id:uid(), name:"", items:[]}]}); }
      overlay.remove(); render(); persist();
    };
    if(cat){
      document.getElementById("cat-delete").onclick = function(){
        if(confirm('Remover a categoria "'+cat.name+'" e tudo dentro dela?')){
          data.categories = data.categories.filter(function(c){return c.id!==cat.id;});
          overlay.remove(); render(); persist();
        }
      };
    }
  }

  function openSubcatModal(catId, subId){
    var cat = findCat(catId);
    var sub = subId ? findSub(catId, subId) : null;
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>'+(sub?"Editar subcategoria":"Nova subcategoria")+' — '+esc(cat.name)+'</h3>'+
        '<div class="field-label">Nome da subcategoria</div>'+
        '<input type="text" id="sub-name" value="'+esc(sub?sub.name:"")+'" placeholder="Ex: Temperos">'+
        '<div class="modal-actions">'+
          '<button class="btn-cancel" id="sub-cancel">Cancelar</button>'+
          '<button class="btn-save" id="sub-save">'+(sub?"Salvar":"Criar")+'</button>'+
        '</div>'+
        (sub ? '<button class="btn-delete" id="sub-delete">Remover subcategoria</button>' : '')+
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById("sub-cancel").onclick = function(){ overlay.remove(); };
    overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
    document.getElementById("sub-save").onclick = function(){
      var name = document.getElementById("sub-name").value.trim();
      if(sub){ sub.name = name; }
      else { cat.subcats.push({id:uid(), name:name, items:[]}); }
      overlay.remove(); render(); persist();
    };
    if(sub){
      document.getElementById("sub-delete").onclick = function(){
        if(confirm('Remover a subcategoria "'+(sub.name||"Geral")+'" e todos os itens dela?')){
          cat.subcats = cat.subcats.filter(function(s){return s.id!==sub.id;});
          overlay.remove(); render(); persist();
        }
      };
    }
  }

  function enterMain(){
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("main-view").classList.remove("hidden");
    render();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async function(){
      try{
        var remote = await fetchRemote();
        if(remote && JSON.stringify(remote) !== JSON.stringify(data)){
          data = mergeInDefaults(remote);
          render();
        }
        clearError();
      }catch(e){ /* silencioso no polling */ }
    }, 20000);
  }

  function chooseRole(r){
    role = r; saveRole(r);
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("gate").classList.add("hidden");
    enterMain();
  }

  var EDITOR_PIN = "0808";

  document.getElementById("gate-editor").onclick = function(){
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("pin-gate").classList.remove("hidden");
    document.getElementById("pin-error").classList.add("hidden");
    var input = document.getElementById("pin-input");
    input.value = "";
    input.focus();
  };
  document.getElementById("pin-cancel").onclick = function(){
    document.getElementById("pin-gate").classList.add("hidden");
    document.getElementById("gate").classList.remove("hidden");
  };
  document.getElementById("pin-confirm").onclick = function(){
    var input = document.getElementById("pin-input");
    if(input.value === EDITOR_PIN){
      document.getElementById("pin-gate").classList.add("hidden");
      chooseRole("editor");
    } else {
      document.getElementById("pin-error").classList.remove("hidden");
      input.value = "";
      input.focus();
    }
  };
  document.getElementById("pin-input").addEventListener("keydown", function(e){
    if(e.key === "Enter") document.getElementById("pin-confirm").click();
  });
  document.getElementById("gate-mae").onclick = function(){ chooseRole("mae"); };
  document.getElementById("switch-role").onclick = function(){
    document.getElementById("main-view").classList.add("hidden");
    document.getElementById("gate").classList.remove("hidden");
  };
  document.getElementById("refresh-btn").onclick = async function(){
    try{
      var remote = await fetchRemote();
      data = mergeInDefaults(remote);
      render();
    }catch(e){ showError("Não foi possível atualizar agora.", null); }
  };
  document.getElementById("fab-add").onclick = openAddModal;
  document.getElementById("add-cat-btn").onclick = function(){ openCatModal(null); };

  async function init(){
    document.getElementById("loading").classList.remove("hidden");
    document.getElementById("boot-error").classList.add("hidden");
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("main-view").classList.add("hidden");
    try{
      var remote = await fetchRemote();
      if(!remote || !remote.categories){
        var fresh = defaultData();
        await saveRemote(fresh);
        data = fresh;
      } else {
        data = mergeInDefaults(remote);
      }
      var savedRole = loadRole();
      document.getElementById("loading").classList.add("hidden");
      if(savedRole){ role = savedRole; enterMain(); }
      else { document.getElementById("gate").classList.remove("hidden"); }
    }catch(e){
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("boot-error-detail").textContent = (e && e.message) ? e.message : String(e);
      document.getElementById("boot-error").classList.remove("hidden");
    }
  }
  document.getElementById("boot-retry").onclick = init;

  init();
})();
</script>
</body>
</html>
